# MouseMIDI settings. key value per line. Edit, then just move the mouse - no reinstall.
# Mouse device: "auto" reads every mouse found (so your 3-button and 5-button mice both work, swap freely),
# or pin a specific node like /dev/input/event4.
mouse          auto

# What each button does: none | shift | erase | play | menu | main
btn_middle     shift
btn_right      erase
btn_side_back  shift
btn_side_fwd   play

# Shift behaviour: latch = tap to toggle on/off (lets you left-click menu options); hold = only while held.
shift_mode     latch
shift_timeout  12

# Wheel value-step note numbers (hex), and panel notes for the tap actions above. Captured on an MPC Live II;
# change only if your model differs.
plus           0x36
minus          0x37
note_shift     0x31
note_erase     0x09
note_play      0x53
note_menu      0x7B
note_main      0x34
invert         0
cc             0
