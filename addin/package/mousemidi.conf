# MouseMIDI settings. key value per line. Edit, then just move the mouse - no reinstall.
# Panel note numbers (hex) captured on an MPC Live II; change only if your model differs.
mouse         /dev/input/event2
minus         0x37
plus          0x36
shift         0x31
erase         0x09
invert        0
cc            0
shift_btn     middle
erase_btn     right
# Shift: latch = tap middle to toggle on/off (lets you left-click Shift menu options,
# since MPC blocks left-click while a button is physically held). hold = Shift only while held.
shift_mode    latch
shift_timeout 12
