# MIDIMouse settings. key value per line. Edits apply live within ~2s - no restart or reinstall.
# Mouse device: "auto" reads every mouse found and watches for one plugged in later; or pin /dev/input/event4.
mouse          auto

# What each button does: none | shift | erase | play | stop | rec | menu | main | tool
# (tool = cycle the Grid tool icons: pencil -> eraser -> select, by tapping the screen)
btn_middle     shift
btn_right      tool
btn_side_back  stop
btn_side_fwd   play

# Shift: latch = tap to toggle on/off (lets you left-click menu options); hold = only while held.
shift_mode     latch
shift_timeout  12

# Wheel: value step. wheel_accel = max steps on a fast spin (1 = off, higher = jumpier). invert flips direction.
wheel_accel    3
invert         0
cc             0

# Grid tool icons for the "tool" action: raw touchscreen coords "x,y", captured on an MPC Live II.
touch          /dev/input/event0
tool1          165,1360
tool2          81,1105
tool3          135,963
tool4          83,758

# Panel note numbers (hex), captured on an MPC Live II; change only if your model differs.
plus           0x36
minus          0x37
note_shift     0x31
note_erase     0x09
note_play      0x53
note_stop      0x51
note_rec       0x52
note_menu      0x7B
note_main      0x34
