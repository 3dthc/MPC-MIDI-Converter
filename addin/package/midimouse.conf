# MouseMIDI settings. key value per line. Edit, then just move the mouse - no reinstall.
# Mouse device: "auto" reads every mouse found and watches for one plugged in later (swap freely),
# or pin a specific node like /dev/input/event4.
mouse          auto

# What each button does: none | shift | erase | play | stop | rec | menu | main
btn_middle     shift
btn_right      erase
btn_side_back  stop
btn_side_fwd   play

# Shift behaviour: latch = tap to toggle on/off (lets you left-click menu options); hold = only while held.
shift_mode     latch
shift_timeout  12

# Wheel: value step (+/-). wheel_accel = max steps on a fast spin (1 = off, higher = jumpier). invert flips direction.
# Config edits apply live within ~2s - no restart or reinstall.
wheel_accel    3
invert         0
cc             0

# Panel note numbers (hex), captured on an MPC Live II; change only if your model differs.
plus           0x36
minus          0x37
note_shift     0x31
note_erase     0x09
note_play      0x53
note_stop      0x51
note_rec       0x52
note_menu      0x7B
note_main      0x34
