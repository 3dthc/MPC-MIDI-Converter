# MPC MIDI Converter: one page. Left: the file browser (8 rows, tap a folder to open it, tap a MIDI file to pick it).
# Right: conversion options and the two convert buttons. Plain look for now; the redesign comes later.
style=flat
theme_bg=1b1d22
theme_panel=24272e
theme_ink=e8e8ea
theme_ink_dim=9aa0aa
theme_accent=e2a03a
theme_tile_on=3a3220
[tab CONVERT]
readout cx=420 cy=126 w=800 h=40 label="" key=folder
button cx=905 cy=126 w=130 h=44 label="UP" key=up
button cx=1050 cy=126 w=130 h=44 label="REFRESH" key=refresh
frame x=20 y=158 w=820 h=424 title=""
list x=32 y=168 w=796 h=404 cols=1 rows=8 th=40 gap=10 key=file mark=1
frame x=860 y=158 w=400 h=424 title=""
enum_h cx=1060 cy=210 label="TRACKS" key=tracks sw=170
enum_h cx=1060 cy=278 label="DRUM MAP" key=drums sw=170
enum_h cx=1060 cy=352 label="QUANTIZE" key=quantize sw=88 rows=2
knob cx=950 cy=446 r=22 label="TRANSPOSE" key=transpose bw=150
enum_h cx=1160 cy=450 label="TRIM START" key=trim sw=85
enum_h cx=1060 cy=556 label="SAVE TO" key=save_to sw=170
button cx=100 cy=620 w=140 h=48 label="< PAGE" key=prev
readout cx=255 cy=620 w=140 h=40 label="" key=page label_align=center
button cx=410 cy=620 w=140 h=48 label="PAGE >" key=next
button cx=860 cy=620 w=220 h=52 label="CONVERT FILE" key=convert
button cx=1130 cy=620 w=240 h=52 label="CONVERT FOLDER" key=convert_all
readout cx=640 cy=682 w=1220 h=40 label="" key=status
qlinks "CONVERT" = transpose,quantize,tracks,drums
