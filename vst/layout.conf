# MPC MIDI Converter: one page. Left: the file browser (8 rows: tap a folder to open it, tap a MIDI file to pick it).
# Right: conversion options. Bottom: paging, the two convert buttons and the status line.
# Look: graphite glass cards on a dark gradient, one warm amber accent, every button the same size.
art_css=skin.css
theme_bg=121317
theme_panel=1a1c21
theme_line=2a2d34
theme_ink=eceef2
theme_ink_dim=8b909b
theme_ink_faint=5b606b
theme_accent=e8a23a
theme_accent_hi=f4b860
theme_knob_face=2a2d34
theme_knob_ring=2a2d34
theme_knob_dot=e8a23a
theme_lcd=0d0e11
theme_seg_active=e8a23a
theme_seg_active_tx=1b1206
theme_seg_inactive=22252b
theme_btn_text_plain=eceef2
theme_tile_on=33291a
[tab CONVERT]
art file=art/bg.svg fit=stretch
text cx=34 cy=112 label="MIDI CONVERTER" size=2.2 weight=700 align=left spacing=3 color=eceef2
text cx=35 cy=140 label="MIDI  >  MPC PATTERN" size=1.3 weight=600 align=left spacing=2 color=e8a23a
readout cx=560 cy=124 w=500 h=58 label="" key=folder tsize=27 tcolor=eceef2
button cx=940 cy=124 w=200 h=62 label="BACK" key=up img=art/btn.svg img_on=art/btn_on.svg
button cx=1155 cy=124 w=200 h=62 label="HOW TO" label_on="CLOSE" key=help img=art/btn.svg img_on=art/btn_on.svg
frame x=20 y=168 w=800 h=528 title=""
list x=36 y=186 w=684 h=494 cols=1 rows=5 th=86 gap=16 key=file mark=1 tsize=31 when=view:big
list x=36 y=186 w=684 h=494 cols=1 rows=8 th=52 gap=10 key=file mark=1 tsize=24 when=view:more
button cx=770 cy=226 w=72 h=62 label="" key=prev img=art/arrow_up.svg img_on=art/arrow_up_on.svg when=view:big
button cx=770 cy=226 w=72 h=62 label="" key=prev img=art/arrow_up.svg img_on=art/arrow_up_on.svg when=view:more
readout cx=770 cy=432 w=72 h=48 label="" key=page label_align=center tsize=22 tcolor=8b909b when=view:big
readout cx=770 cy=432 w=72 h=48 label="" key=page label_align=center tsize=22 tcolor=8b909b when=view:more
button cx=770 cy=640 w=72 h=62 label="" key=next img=art/arrow_down.svg img_on=art/arrow_down_on.svg when=view:big
button cx=770 cy=640 w=72 h=62 label="" key=next img=art/arrow_down.svg img_on=art/arrow_down_on.svg when=view:more
text cx=50 cy=214 label="HOW TO USE" size=2.0 weight=700 align=left spacing=2 color=e8a23a when=view:help
text cx=50 cy=272 label="1.  Tap a drive, then a folder." size=2.05 weight=600 align=left spacing=0 color=eceef2 when=view:help
text cx=50 cy=322 label="2.  Tap a MIDI file, then CONVERT FILE." size=2.05 weight=600 align=left spacing=0 color=eceef2 when=view:help
text cx=50 cy=368 label="     Or CONVERT FOLDER for the whole folder." size=2.05 weight=600 align=left spacing=0 color=eceef2 when=view:help
text cx=50 cy=418 label="3.  Patterns go to MIDI Import on that drive." size=2.05 weight=600 align=left spacing=0 color=eceef2 when=view:help
text cx=50 cy=468 label="4.  Load a pattern onto a track." size=2.05 weight=600 align=left spacing=0 color=eceef2 when=view:help
text cx=50 cy=540 label="SPLIT TRACKS:  one pattern per instrument" size=1.75 weight=600 align=left spacing=0 color=9aa0aa when=view:help
text cx=50 cy=584 label="DRUM MAP:  GM drums onto MPC pads" size=1.75 weight=600 align=left spacing=0 color=9aa0aa when=view:help
text cx=50 cy=628 label="QUANTIZE:  snaps notes to the grid" size=1.75 weight=600 align=left spacing=0 color=9aa0aa when=view:help
frame x=840 y=168 w=420 h=362 title=""
text cx=1050 cy=206 label="SPLIT TRACKS" size=2.0 weight=700 spacing=2 color=eceef2
enum_h cx=1050 cy=240 label="" key=tracks sw=180 sh=50
text cx=1050 cy=290 label="DRUM MAP" size=2.0 weight=700 spacing=2 color=eceef2
enum_h cx=1050 cy=324 label="" key=drums sw=180 sh=50
text cx=1050 cy=374 label="QUANTIZE" size=2.0 weight=700 spacing=2 color=eceef2
enum_h cx=1050 cy=408 label="" key=quantize sw=92 sh=50
text cx=1050 cy=458 label="LIST SIZE" size=2.0 weight=700 spacing=2 color=eceef2
enum_h cx=1050 cy=492 label="" key=rows sw=180 sh=50
button cx=945 cy=578 w=200 h=62 label="CONVERT FILE" key=convert img=art/btn_main.svg img_on=art/btn_main_on.svg
button cx=1155 cy=578 w=200 h=62 label="CONVERT FOLDER" key=convert_all img=art/btn_main.svg img_on=art/btn_main_on.svg
readout cx=1050 cy=664 w=420 h=60 label="" key=status tsize=23 tcolor=f4b860
qlinks "CONVERT" = tracks,drums,quantize,rows
