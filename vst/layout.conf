# MPC MIDI Converter: one page. Left: the file browser (8 rows: tap a folder to open it, tap a MIDI file to pick it).
# Right: conversion options. Bottom: paging, the two convert buttons and the status line.
# Look: graphite glass cards on a dark gradient, one warm amber accent, every button the same size.
