button cx=900 cy=630 w=160 h=50 label="CONVERT FILE" key=convert color=e8a23a
button cx=1100 cy=630 w=160 h=50 label="CONVERT FOLDER" key=convert_all color=e8a23a
readout cx=640 cy=688 w=1240 h=40 label="" key=status tsize=18 tcolor=f4b860
qlinks "CONVERT" = transpose,quantize,tracks,drums
