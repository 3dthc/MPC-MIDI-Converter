# MPC MIDI Converter: one page. Left: the file browser (8 rows: tap a folder to open it, tap a MIDI file to pick it).
# Right: conversion options. Bottom: paging, the two convert buttons and the status line.
# Look: graphite glass cards on a dark gradient, one warm amber accent, every button the same size.
art_css=skin.css
theme_bg=121317
theme_panel=1a1c21
theme_line=2a2d34
theme_ink=eceef2
theme_ink_dim=8b909b
theme_ink_faint=5b606b
theme_accent=e8a23a
theme_accent_hi=f4b860
theme_knob_face=2a2d34
theme_knob_ring=2a2d34
theme_knob_dot=e8a23a
theme_lcd=0d0e11
theme_seg_active=e8a23a
theme_seg_active_tx=1b1206
theme_seg_inactive=22252b
theme_btn_text_plain=eceef2
theme_tile_on=33291a
[tab CONVERT]
art file=art/bg.svg fit=stretch
text cx=34 cy=116 label="MIDI CONVERTER" size=1.75 weight=700 align=left spacing=4 color=eceef2
text cx=36 cy=142 label="MIDI  >  MPC PATTERN" size=1.2 weight=600 align=left spacing=3 color=e8a23a
readout cx=545 cy=126 w=480 h=46 label="" key=folder tsize=19 tcolor=eceef2
button cx=900 cy=126 w=160 h=50 label="UP" key=up color=2c2f37
button cx=1100 cy=126 w=160 h=50 label="REFRESH" key=refresh color=2c2f37
frame x=20 y=166 w=820 h=420 title=""
list x=36 y=180 w=788 h=392 cols=1 rows=8 th=40 gap=9 key=file mark=1 tsize=19
frame x=860 y=166 w=400 h=420 title=""
enum_h cx=1060 cy=216 label="TRACKS" key=tracks sw=170 sh=34
enum_h cx=1060 cy=284 label="DRUM MAP" key=drums sw=170 sh=34
enum_h cx=1060 cy=356 label="QUANTIZE" key=quantize sw=86 sh=32 rows=2
text cx=970 cy=446 label="TRANSPOSE" size=1.35 weight=600 spacing=2 color=eceef2
knob cx=970 cy=480 r=18 key=transpose lay=side bw=170 bh=44 vs=24
enum_h cx=1160 cy=480 label="TRIM START" key=trim sw=80 sh=34
enum_h cx=1060 cy=556 label="SAVE TO" key=save_to sw=170 sh=34
button cx=110 cy=630 w=160 h=50 label="< PAGE" key=prev color=2c2f37
readout cx=270 cy=630 w=130 h=46 label="" key=page label_align=center tsize=18 tcolor=8b909b
